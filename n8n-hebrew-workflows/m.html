  <!--
    This is a single-page Redoc site served behind CloudFront's SPA fallback
    (custom_403/404 -> /index.html @ 200), so S3 misses return index.html with
    an HTTP 200 for ANY path. Only "/" and "/api" are real routes (the docs);
    every other path is treated as not-found. We flag it before first paint so
    CSS can swap the docs for the #not-found view without a flash, and the app
    bootstrap below skips Redoc entirely. Hash navigation (#tag/...) leaves
    pathname unchanged, so deep links within an allowed route are unaffected.

    NOTE: this is a client-side 404 — the HTTP status is still 200. A true
    edge-level 404 would need a CloudFront Function on the distribution.
  -->
  <script>
    (function () {
      var path = window.location.pathname;
      var known = path === '/' || path === '/api' || path === '/api/';
      if (!known) {
        window.__developersNotFound = true;
        document.documentElement.className += ' route-not-found';
      }
    })();
  </script>
